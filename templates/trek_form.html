{% extends "base.html" %}
{% block title %}{{ 'Edit' if trek else 'Add' }} Trek{% endblock %}

{% block content %}
<h2>{{ 'Edit' if trek else 'Add' }} Trek</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Trek Name</label>
        <input type="text" name="name" class="form-control" value="{{ trek.name if trek else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Location</label>
        <input type="text" name="location" class="form-control" value="{{ trek.location if trek else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Difficulty</label>
        <select name="difficulty" class="form-control">
            <option value="Easy" {% if trek and trek.difficulty == 'Easy' %}selected{% endif %}>Easy</option>
            <option value="Moderate" {% if trek and trek.difficulty == 'Moderate' %}selected{% endif %}>Moderate</option>
            <option value="Hard" {% if trek and trek.difficulty == 'Hard' %}selected{% endif %}>Hard</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Duration (days)</label>
        <input type="number" name="duration" class="form-control" value="{{ trek.duration if trek else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">Available Slots</label>
        <input type="number" name="available_slots" class="form-control" value="{{ trek.available_slots if trek else '' }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Start Date</label>
        <input type="date" name="start_date" class="form-control" value="{{ trek.start_date if trek else '' }}">
    </div>
    <div class="mb-3">
        <label class="form-label">End Date</label>
        <input type="date" name="end_date" class="form-control" value="{{ trek.end_date if trek else '' }}">
    </div>
    <div class="mb-3">
    <label class="form-label">Assign Staff</label>
    <select name="assigned_staff_id" class="form-control">
        <option value="">-- Not Assigned --</option>
        {% for staff in approved_staff %}
        <option value="{{ staff.id }}" {% if trek and trek.assigned_staff_id == staff.id %}selected{% endif %}>
            {{ staff.name }}
        </option>
        {% endfor %}
    </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
</form>
{% endblock %}
