{% extends "base.html" %}
{% block title %}Edit Profile{% endblock %}

<p><a href="{{ url_for('edit_profile') }}">Edit Profile</a></p>

{% block content %}
<h2>Edit Profile</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">Name</label>
        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
    </div>
    {% if current_user.role == 'staff' %}
    <div class="mb-3">
        <label class="form-label">Contact Number</label>
        <input type="text" name="contact_number" class="form-control" value="{{ current_user.staff_profile.contact_number if current_user.staff_profile else '' }}">
    </div>
    {% endif %}
    <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
